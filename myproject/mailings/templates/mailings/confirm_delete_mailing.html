{% extends "base.html" %}

{% block title %}Подтверждение удаления рассылки{% endblock %}

{% block content %}
<h2>Подтверждение удаления</h2>
<p>Вы уверены, что хотите удалить рассылку "<strong>{{ mailing.name }}</strong>"?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Удалить</button>
    <a class="btn btn-secondary" href="{% url 'mailing_list' %}">Отмена</a>
</form>
{% endblock %}
