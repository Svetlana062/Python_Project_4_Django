{% extends "base.html" %}

{% block title %}Подтверждение удаления рассылки{% endblock %}

{% block content %}
<h2>Подтверждение удаления</h2>
<p>Вы уверены, что хотите удалить рассылку "<strong>{{ mailing.name }}</strong>"?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit">Да, удалить</button>
    <a href="{% url 'mailings_list' %}">Отмена</a>
</form>
{% endblock %}
