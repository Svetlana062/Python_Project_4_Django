{% extends "base.html" %}

{% block content %}
<h1>Список рассылок</h1>

<!-- Кнопка для создания новой рассылки -->
<a href="{% url 'mailing_add' %}" class="btn btn-primary">Создать новую рассылку</a>

<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>Название</th>
            <th>Статус</th>
            <th>Действия</th>
        </tr>
    </thead>
    <tbody>
        {% for mailing in mailings %}
        <tr>
            <td>{{ mailing.id }}</td>
            <!-- если есть поле name -->
            <td>{{ mailing.name }}</td>
            <!-- или используйте message.subject -->
            <!-- <td>{{ mailing.message.subject }}</td> -->
            <td>{{ mailing.status }}</td>
            <td>
                <!-- Кнопка для запуска рассылки -->
                <form action="{% url 'send_mailing' mailing.id %}" method="post" style="display:inline;">
                    {% csrf_token %}
                    <button type="submit">Запустить рассылку</button>
                </form>
                <!-- Можно добавить ссылку на детали или редактирование -->
                <a href="{% url 'detail_mailing' mailing.id %}">Подробнее</a>
            </td>
        </tr>
        {% empty %}
        <tr><td colspan="4">Нет рассылок</td></tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
