{% extends "base.html" %}

{% block content %}
<h2>Удалить сообщение?</h2>

<p>Вы уверены, что хотите удалить сообщение: "{{ object.subject }}"?</p>

<form method="post">
  {% csrf_token %}
  <button type="submit" class="btn btn-danger">Удалить</button>
  <a href="{% url 'list_messages' %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
