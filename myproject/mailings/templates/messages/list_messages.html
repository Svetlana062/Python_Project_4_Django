{% extends "base.html" %}

{% block title %}Сообщения{% endblock %}

{% block content %}
<h2>Список сообщений</h2>

<a  class="btn btn-primary mb-2" href="{% url 'message_add' %}">Создать новое сообщение</a>

<table class="table table-striped table-bordered">
    <thead>
        <tr>
            <th>Тема письма</th>
            <th>Действия</th>
        </tr>
    </thead>
    <tbody>
        {% for message in messages %}
        <tr>
            <td>{{ message.subject }}</td>
            <td>
                <a class="p-2 btn btn-outline-primary me-2" href="{% url 'message_detail' message.id %}">Просмотр</a> |
                <a class="p-2 btn btn-primary me-2" href="{% url 'message_edit' message.id %}">Редактировать</a> |
                <a class="p-2 btn btn-danger" href="{% url 'message_delete' message.id %}">Удалить</a>
            </td>
        </tr>
        {% empty %}
        <tr><td colspan="2">Нет сообщений.</td></tr>
        {% endfor %}
    </tbody>
</table>

{% endblock %}
