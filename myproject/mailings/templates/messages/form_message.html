{% extends "base.html" %}
{% block content %}
<h2>{% if object %}Редактировать сообщение{% else %}Создать сообщение{% endif %}</h2>

<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit" class="btn btn-primary">
    {% if object %}Сохранить{% else %}Создать{% endif %}
  </button>
  <a href="{% url 'list_messages' %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
