{% extends "base.html" %}

{% block content %}
<h2>Детали получателя</h2>
<ul>
    <li>ID: {{ recipient.id }}</li>
    <li>Email: {{ recipient.email }}</li>
    <li>ФИО: {{ recipient.full_name }}</li>
    <li>Комментарий: {{ recipient.comment }}</li>
</ul>
<a class="p-2 btn btn-outline-primary me-2" href="{% url 'recipient_list' %}">Назад к списку</a>
{% endblock %}
