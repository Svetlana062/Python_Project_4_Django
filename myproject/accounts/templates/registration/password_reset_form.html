{% extends "base.html" %}

{% block title %}Восстановление пароля{% endblock %}

{% block content %}
<h2>Восстановление пароля</h2>
<p>Введите ваш email, чтобы получить ссылку для сброса пароля.</p>
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button class="p-2 btn btn-outline-primary" type="submit">Отправить</button>
</form>
{% endblock %}
